name: Generate Vue Charts Bun lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vue-chart-lock-bootstrap.yml'
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Resolve native Vue chart libraries with Bun
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun remove @tanstack/charts
          bun add vue-chrts@^2.2.3 @unovis/ts@^1.7.1 @unovis/vue@^1.7.1
          echo "QUILL_VUE_CHART_PACKAGE_BEGIN"
          base64 -w0 package.json
          echo
          echo "QUILL_VUE_CHART_PACKAGE_END"
          echo "QUILL_VUE_CHART_LOCK_BEGIN"
          base64 -w0 bun.lock
          echo
          echo "QUILL_VUE_CHART_LOCK_END"
