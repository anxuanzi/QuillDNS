name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: npm install --prefix web && npm run build --prefix web
      - name: Go formatting
        run: gofmt -w cmd internal webassets
      - name: Verify Go module metadata
        run: go mod tidy
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Export normalized files for source control
        run: |
          find cmd internal webassets -type f -name '*.go' | sort | while read -r f; do
            echo "QUILL_SOURCE_BEGIN:$f"
            base64 "$f"
            echo "QUILL_SOURCE_END"
          done
          for f in go.mod go.sum web/package-lock.json; do
            echo "QUILL_SOURCE_BEGIN:$f"
            base64 "$f"
            echo "QUILL_SOURCE_END"
          done
