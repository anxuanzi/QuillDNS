name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: npm install --prefix web && npm run build --prefix web
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal webassets)"
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Confirm Go module metadata is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Export frontend lockfile for reproducible releases
        run: |
          echo "QUILL_NPM_LOCK_BEGIN"
          base64 web/package-lock.json
          echo "QUILL_NPM_LOCK_END"
