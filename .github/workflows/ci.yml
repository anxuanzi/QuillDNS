name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: npm install --prefix web && npm run build --prefix web
      - name: Go dependencies
        run: go mod tidy
      - name: Format Go
        run: gofmt -w cmd internal webassets
      - name: Unit tests and race detection
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
