name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix web --no-audit
      - name: Build embedded SPA
        run: npm run build --prefix web
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal webassets)"
      - name: Go tests and race detection
        run: go test -race ./...
      - name: Go static analysis
        run: go vet ./...
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build production Go binary
        run: CGO_ENABLED=0 go build -trimpath -o quilldns ./cmd/quilldns
      - name: Build container image
        run: docker build -f deploy/Dockerfile -t quilldns:ci .
