name: Browser acceptance and screenshots
on:
  workflow_call:
  workflow_dispatch:

# Callable from the main CI pipeline so image publishing is gated on Chrome E2E.
concurrency:
  group: quilldns-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build frontend with Bun and compile Go binary
        run: |
          cd web && bun install --frozen-lockfile && bun run build && cd ..
          CGO_ENABLED=0 go build -trimpath -o quilldns ./cmd/quilldns
      - name: Use preinstalled runner Chrome
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome
          google-chrome --version
      - name: Test running embedded QuillDNS interface
        run: |
          set -euo pipefail
          ./quilldns -dns 127.0.0.1:11053 -http 127.0.0.1:18080 -data "${RUNNER_TEMP}/browser-e2e.sqlite" > "${RUNNER_TEMP}/quilldns.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          python tests/e2e/test_console.py
      - name: Upload actual UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quilldns-ui-screenshots
          path: tests/e2e/screenshots/*.png
          retention-days: 30
          if-no-files-found: warn
