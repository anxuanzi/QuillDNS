name: Browser acceptance and screenshots
on:
  push:
    branches: [main]
  pull_request:

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frontend with Bun and compile Go binary
        run: |
          cd web && bun install --frozen-lockfile && bun run build && cd ..
          CGO_ENABLED=0 go build -trimpath -o quilldns ./cmd/quilldns
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test running embedded QuillDNS interface
        run: |
          set -euo pipefail
          ./quilldns -dns 127.0.0.1:11053 -http 127.0.0.1:18080 -data "${RUNNER_TEMP}/browser-e2e.sqlite" > "${RUNNER_TEMP}/quilldns.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          python tests/e2e/test_console.py
      - name: Upload actual UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quilldns-ui-screenshots
          path: tests/e2e/screenshots/*.png
          retention-days: 30
          if-no-files-found: warn
